name: Wind alert check

on:
  schedule:
    - cron: "*/10 6-22 * * *"
      timezone: "Europe/Helsinki"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wind-alert-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run wind alert check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONPATH: src
        run: python src/main.py --config config.yaml

      - name: Commit updated state
        run: |
          git config user.name "wind-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
  
