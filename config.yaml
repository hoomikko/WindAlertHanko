location:
  name: "Hanko, Tulliniemi"
  latitude: 59.8086
  longitude: 22.9122
  fmi_station_id: 100946

wind:
  min_speed_ms: 7.0
  max_speed_ms: 10.0
  direction_filter: ["W", "NW"]
  hysteresis:
    trigger_margin_ms: 0.0
    release_margin_ms: 0.5
    min_minutes_above: 10
    reminder_interval_minutes: 120

forecast:
  enabled: true
  hours_ahead: 6

chart:
  enabled: false
  lookback_hours: 8

schedule:
  active_hours: "0-23"
  poll_interval_minutes: 10

notifications:
  channels:
    - type: ntfy
      enabled: true
      topic: "${NTFY_TOPIC}"
      server: "https://ntfy.sh"

telemetry:
  enabled: false
  endpoint: ""

state_path: "state/wingfoil_alert_state.json"
  
